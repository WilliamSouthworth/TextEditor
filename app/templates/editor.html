
<!--
    Page Purpose:
        - Displays the PDF editor workspace
        - Supports multiple uploaded PDFs
        - Allows switching between uploaded PDFs
        - Displays the selected PDF using PDF.js

    Supporting Files:
        - Inheritance Layout: app/templates/layout.html
        - CSS: app/static/css/editor.css
        - JS: app/static/js/editor.js
        - Python:
            - app/routes/editor.py
            - app/routes/main.py

    Notes:
        - Flask provides the uploaded PDF collection
        - The current document ID identifies the selected PDF
        - PDF.js renders the selected document
-->

{% extends "layout.html" %}

{% block title %}
PDF Editor
{% endblock %}


{% block head %}

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/pdf_viewer.css"
>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/editor.css') }}"
>

{% endblock %}


{% block content %}

<div
    class="editor-container"
    id="editor-container"
    data-current-document-id="{{ current_document_id }}"
>

    <!-- =========================================
         EDITOR HEADER
         ========================================= -->

    <div class="editor-header">

        <div>

            <span class="section-label">
                PDF EDITOR
            </span>

            <h1 id="editor-filename">
                {{ filename }}
            </h1>

            <p>
                Select and modify content in your PDF.
            </p>

        </div>

        <a
            href="{{ url_for('main.index') }}"
            class="back-button"
        >
            Back
        </a>

    </div>


    <!-- =========================================
         EDITOR WORKSPACE
         ========================================= -->

    <div class="editor-workspace">


        <!-- =====================================
             LEFT SIDE - EDITING TOOLS
             ===================================== -->

        <aside class="editor-tools">

            <h2>
                Tools
            </h2>

            <button
                type="button"
                id="select-tool"
                class="editor-tool active"
                data-tool="select"
            >
                Select
            </button>

            <button
                type="button"
                id="highlight-tool"
                class="editor-tool"
                data-tool="highlight"
            >
                Highlight
            </button>

            <button
                type="button"
                id="add-text-tool"
                class="editor-tool"
                data-tool="text"
            >
                Add Text
            </button>

            <button
                type="button"
                id="remove-tool"
                class="editor-tool"
                data-tool="remove"
            >
                Remove
            </button>

        </aside>


        <!-- =====================================
             RIGHT SIDE - PDF DOCUMENT
             ===================================== -->

        <section
            class="editor-document"
            id="pdf-viewer"
        >

            <!-- =================================
                 DOCUMENT SELECTOR
                 ================================= -->

            <div class="editor-document-selector">

                <label for="editor-document-select">
                    Document
                </label>

                <select
                    id="editor-document-select"
                >

                    {% for document in documents %}

                    <option
                        value="{{ document.id }}"
                        data-file-url="{{ document.file_url }}"
                        {% if document.id == current_document_id %}
                        selected
                        {% endif %}
                    >

                        {{ document.filename }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- =================================
                 PDF LOADING MESSAGE
                 ================================= -->

            <div
                id="pdf-loading"
                class="pdf-loading"
            >
                Loading PDF...
            </div>


            <!-- =================================
                 PDF ERROR MESSAGE
                 ================================= -->

            <div
                id="pdf-error"
                class="pdf-error"
                hidden
            >
                Unable to load PDF.
            </div>


            <!-- =================================
                 PDF PAGE CONTAINER
                 ================================= -->

            <div
                id="pdf-pages"
                class="pdf-pages"
            ></div>

        </section>


    </div>

</div>

{% endblock %}


{% block scripts %}

<script
    type="module"
    src="{{ url_for('static', filename='js/editor.js') }}"
></script>

{% endblock %}
