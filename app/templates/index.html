<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
    <main>
        <h1>Text Editor</h1>
        <p>Upload a PDF to begin.</p>

        <form id="upload-form">
            <input
                type="file"
                id="pdf-file"
                accept=".pdf"
            >

            <button type="submit">
                Upload PDF
            </button>
        </form>

        <div id="status"></div>
    </main>

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>
</body>
</html>
