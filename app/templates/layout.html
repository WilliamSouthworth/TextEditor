<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Text Editor
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    {% block head %}
    {% endblock %}
</head>

<body>

    <header>
        <nav>
            <a href="{{ url_for('main.index') }}">
                Home
            </a>

            <a href="#">
                Editor
            </a>

            <a href="#">
                Split
            </a>

            <a href="#">
                Merge
            </a>
        </nav>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer>
        <p>
            &copy; 2026 Text Editor
        </p>
    </footer>


    {% block scripts %}
    {% endblock %}

</body>
</html>
